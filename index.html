<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ROBO RUN // Neon Circuit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --ink: #12233c;
      --muted: #54728d;
      --paper: #f4f9f5;
      --mint: #b7f0d4;
      --aqua: #62dfdc;
      --orange: #ff825d;
      --yellow: #ffd45d;
      --pink: #f77ca7;
      --line: rgba(18, 35, 60, .16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: 'Chakra Petch', sans-serif;
    }

    .shell {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 25px clamp(18px, 4vw, 54px) 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      position: relative;
      z-index: 2;
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      width: 46px;
      height: 46px;
      border: 3px solid var(--ink);
      border-radius: 12px 12px 18px 12px;
      background: var(--yellow);
      box-shadow: 5px 5px 0 var(--ink);
      display: grid;
      place-items: center;
      font-size: 25px;
      transform: rotate(-5deg);
    }
    .brand h1 { margin: 0; font-size: 19px; line-height: 1; letter-spacing: .08em; font-weight: 700; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .16em; }

    .stats { display: flex; gap: 11px; }
    .stat {
      min-width: 112px;
      padding: 9px 14px 8px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: rgba(255,255,255,.65);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .stat span { display: block; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .11em; }
    .stat strong { display: block; margin-top: 2px; font-family: 'Space Mono', monospace; font-size: 18px; letter-spacing: .04em; }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      position: relative;
    }

    .game-frame {
      width: 100%;
      border: 3px solid var(--ink);
      border-radius: 15px;
      overflow: hidden;
      background: #d9f5e9;
      box-shadow: 9px 9px 0 var(--ink);
      position: relative;
      touch-action: manipulation;
    }
    canvas { width: 100%; display: block; aspect-ratio: 2.1 / 1; min-height: 300px; max-height: 570px; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(244, 249, 245, .28);
      transition: opacity .2s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .panel {
      max-width: 390px;
      padding: 27px 30px 25px;
      text-align: center;
      border: 3px solid var(--ink);
      border-radius: 11px;
      background: #fffdf1;
      box-shadow: 7px 7px 0 var(--ink);
    }
    .panel .eyebrow { margin: 0 0 8px; color: var(--orange); font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .16em; }
    .panel h2 { margin: 0; font-size: clamp(27px, 4vw, 41px); line-height: .95; letter-spacing: .02em; }
    .panel p { margin: 14px 0 19px; color: var(--muted); line-height: 1.45; font-family: 'Space Mono', monospace; font-size: 11px; }
    button {
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 12px 19px;
      color: var(--ink);
      background: var(--aqua);
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .07em;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    button:hover { background: var(--yellow); }
    button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding-top: 22px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .04em;
    }
    .key { color: var(--ink); font-weight: 700; }
    .signal { display: flex; align-items: center; gap: 7px; }
    .signal i { width: 8px; height: 8px; border-radius: 50%; background: #42c991; box-shadow: 0 0 0 3px rgba(66,201,145,.17); }

    @media (max-width: 600px) {
      .shell { padding: 17px 12px 14px; }
      header { align-items: center; }
      .brand h1 { font-size: 15px; }
      .brand p { font-size: 8px; }
      .brand-mark { width: 38px; height: 38px; font-size: 20px; box-shadow: 4px 4px 0 var(--ink); }
      .stats { gap: 6px; }
      .stat { min-width: 74px; padding: 7px 8px; box-shadow: 2px 2px 0 var(--ink); }
      .stat span { font-size: 7px; }
      .stat strong { font-size: 13px; }
      .game-frame { box-shadow: 5px 5px 0 var(--ink); }
      canvas { min-height: 260px; aspect-ratio: 1.35 / 1; }
      .panel { padding: 23px 20px; }
      footer { padding-top: 16px; font-size: 8px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⚡</div>
        <div><h1>ROBO RUN</h1><p>NEON CIRCUIT / SECTOR 07</p></div>
      </div>
      <div class="stats" aria-label="Game statistics">
        <div class="stat"><span>DISTANCE</span><strong id="score">00000</strong></div>
        <div class="stat"><span>BEST RUN</span><strong id="best">00000</strong></div>
      </div>
    </header>

    <main>
      <div class="game-frame" id="gameFrame">
        <canvas id="game" aria-label="Robo Run game"></canvas>
        <div class="overlay" id="overlay">
          <section class="panel">
            <p class="eyebrow" id="panelEyebrow">BOOT SEQUENCE COMPLETE</p>
            <h2 id="panelTitle">READY TO<br>ROLL?</h2>
            <p id="panelText">Help your little bot clear the city grid.<br>Jump with SPACE or tap the screen.</p>
            <button id="startButton" type="button">START RUN</button>
          </section>
        </div>
      </div>
    </main>

    <footer><span><span class="key">SPACE</span> / <span class="key">TAP</span> TO JUMP</span><span class="signal"><i></i> SYSTEMS NOMINAL</span></footer>
  </div>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const frame = document.getElementById('gameFrame');
      const overlay = document.getElementById('overlay');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const startButton = document.getElementById('startButton');
      const panelEyebrow = document.getElementById('panelEyebrow');
      const panelTitle = document.getElementById('panelTitle');
      const panelText = document.getElementById('panelText');

      const colors = { ink: '#12233c', aqua: '#62dfdc', orange: '#ff825d', yellow: '#ffd45d', pink: '#f77ca7', mint: '#b7f0d4' };
      let width = 900, height = 428, scale = 1, lastTime = 0, animationId;
      let state = 'ready', score = 0, best = Number(localStorage.getItem('robo-run-best') || 0);
      let speed = 300, spawnTimer = 0, groundOffset = 0, shake = 0;
      const robot = { x: 115, y: 0, w: 56, h: 70, vy: 0, grounded: true, leg: 0 };
      const obstacles = [];
      const sparks = [];
      bestEl.textContent = String(best).padStart(5, '0');

      function resize() {
        const rect = frame.getBoundingClientRect();
        scale = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = width < 600 ? Math.max(260, width / 1.35) : Math.min(570, Math.max(300, width / 2.1));
        canvas.width = width * scale; canvas.height = height * scale;
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        robot.y = height - 83;
      }
      window.addEventListener('resize', resize);

      function reset() {
        score = 0; speed = 300; spawnTimer = .7; groundOffset = 0; shake = 0; obstacles.length = 0; sparks.length = 0;
        robot.y = height - 83; robot.vy = 0; robot.grounded = true;
        scoreEl.textContent = '00000';
      }
      function start() { reset(); state = 'playing'; overlay.classList.add('hidden'); lastTime = performance.now(); animationId = requestAnimationFrame(loop); }
      function jump() {
        if (state === 'ready' || state === 'gameover') { start(); return; }
        if (robot.grounded) { robot.vy = -650; robot.grounded = false; burst(robot.x + 20, robot.y + robot.h, colors.aqua, 5); }
      }
      function burst(x, y, color, amount) {
        for (let i = 0; i < amount; i++) sparks.push({ x, y, vx: (Math.random() - .5) * 100, vy: -Math.random() * 100, life: .35, color });
      }
      function spawn() {
        const tall = Math.random() > .45;
        obstacles.push({ x: width + 30, y: height - (tall ? 87 : 61), w: tall ? 28 : 46, h: tall ? 74 : 48, type: tall ? 'antenna' : 'barrier' });
        spawnTimer = Math.max(.72, 1.3 - score / 2600) + Math.random() * .8;
      }
      function collision(a, b) {
        return a.x + 9 < b.x + b.w && a.x + a.w - 9 > b.x && a.y + 7 < b.y + b.h && a.y + a.h > b.y + 3;
      }
      function endGame() {
        state = 'gameover'; shake = .28; best = Math.max(best, Math.floor(score)); localStorage.setItem('robo-run-best', best); bestEl.textContent = String(best).padStart(5, '0');
        panelEyebrow.textContent = 'SIGNAL LOST / RUN ENDED'; panelTitle.innerHTML = 'NICE TRY,<br>PILOT.'; panelText.innerHTML = `You reached ${Math.floor(score).toString().padStart(5, '0')} metres.<br>Ready for another run?`; startButton.textContent = 'REBOOT ROBOT'; overlay.classList.remove('hidden');
      }

      function drawBackground() {
        ctx.fillStyle = '#d9f5e9'; ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#c2ece0';
        for (let x = -groundOffset * .18 % 100 - 100; x < width + 100; x += 100) { ctx.fillRect(x, height - 185, 70, 2); ctx.fillRect(x + 20, height - 185, 2, 75); }
        ctx.fillStyle = '#a9dfd9';
        for (let x = -groundOffset * .35 % 160 - 160; x < width + 160; x += 160) { const bh = 35 + ((x * 7) % 45); ctx.fillRect(x, height - 53 - bh, 87, bh); ctx.fillStyle = '#c4ece2'; ctx.fillRect(x + 12, height - 42 - bh, 8, 7); ctx.fillRect(x + 30, height - 42 - bh, 8, 7); ctx.fillStyle = '#a9dfd9'; }
        ctx.fillStyle = colors.ink; ctx.fillRect(0, height - 16, width, 3);
        ctx.fillStyle = colors.orange;
        for (let x = -groundOffset % 45 - 45; x < width + 45; x += 45) ctx.fillRect(x, height - 11, 19, 2);
      }
      function drawRobot() {
        const runBob = robot.grounded ? Math.abs(Math.sin(robot.leg)) * 2 : 0, x = robot.x, y = robot.y + runBob;
        ctx.save(); ctx.translate(x, y);
        ctx.fillStyle = colors.ink; ctx.fillRect(11, 61, 13, 9); ctx.fillRect(38, 61, 13, 9);
        ctx.fillStyle = colors.orange; ctx.fillRect(13, 55, 11, 11); ctx.fillRect(39, 55, 11, 11);
        ctx.fillStyle = colors.aqua; ctx.fillRect(7, 17, 47, 43); ctx.strokeStyle = colors.ink; ctx.lineWidth = 3; ctx.strokeRect(7, 17, 47, 43);
        ctx.fillStyle = colors.yellow; ctx.fillRect(13, 24, 35, 22); ctx.strokeRect(13, 24, 35, 22);
        ctx.fillStyle = colors.ink; ctx.fillRect(19, 30, 7, 7); ctx.fillRect(35, 30, 7, 7);
        ctx.fillStyle = colors.pink; ctx.fillRect(10, 48, 10, 4); ctx.fillRect(40, 48, 10, 4);
        ctx.fillStyle = colors.ink; ctx.fillRect(27, 7, 4, 10); ctx.fillStyle = colors.orange; ctx.beginPath(); ctx.arc(29, 5, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = colors.ink; ctx.fillRect(2, 28, 6, 22); ctx.fillRect(54, 28, 6, 22); ctx.restore();
      }
      function drawObstacle(o) {
        ctx.save(); ctx.translate(o.x, o.y); ctx.fillStyle = o.type === 'antenna' ? colors.pink : colors.orange; ctx.strokeStyle = colors.ink; ctx.lineWidth = 3;
        if (o.type === 'antenna') { ctx.fillRect(7, 16, 16, o.h - 16); ctx.strokeRect(7, 16, 16, o.h - 16); ctx.fillStyle = colors.yellow; ctx.fillRect(0, 25, 30, 8); ctx.strokeRect(0, 25, 30, 8); ctx.beginPath(); ctx.arc(15, 7, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
        else { ctx.fillRect(0, 11, o.w, o.h - 11); ctx.strokeRect(0, 11, o.w, o.h - 11); ctx.fillStyle = colors.yellow; ctx.fillRect(8, 20, 10, 5); ctx.fillRect(28, 20, 10, 5); }
        ctx.restore();
      }
      function drawSparks(dt) { for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 250 * dt; if (p.life <= 0) sparks.splice(i, 1); else { ctx.globalAlpha = p.life * 3; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); ctx.globalAlpha = 1; } } }

      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, .035); lastTime = now;
        if (state !== 'playing') return;
        score += dt * speed / 18; speed += dt * 3.5; spawnTimer -= dt; groundOffset += speed * dt;
        if (spawnTimer <= 0) spawn();
        robot.vy += 1750 * dt; robot.y += robot.vy * dt; robot.leg += dt * 13;
        if (robot.y >= height - 83) { robot.y = height - 83; robot.vy = 0; robot.grounded = true; }
        for (let i = obstacles.length - 1; i >= 0; i--) { const o = obstacles[i]; o.x -= speed * dt; if (collision(robot, o)) { burst(robot.x + 28, robot.y + 30, colors.orange, 15); endGame(); return; } if (o.x + o.w < -20) obstacles.splice(i, 1); }
        ctx.save(); if (shake > 0) { shake -= dt; ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 5); } drawBackground(); obstacles.forEach(drawObstacle); drawRobot(); drawSparks(dt); ctx.restore();
        scoreEl.textContent = String(Math.floor(score)).padStart(5, '0'); animationId = requestAnimationFrame(loop);
      }

      startButton.addEventListener('click', start);
      frame.addEventListener('pointerdown', (event) => { if (event.target !== startButton) jump(); });
      window.addEventListener('keydown', (event) => { if (event.code === 'Space' || event.code === 'ArrowUp') { event.preventDefault(); jump(); } });
      resize();
      drawBackground(); drawRobot();
    })();
  </script>
</body>
</html>
